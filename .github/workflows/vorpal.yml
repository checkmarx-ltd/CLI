name: Vorpal Security Scan

on:
  pull_request:
    branches: [ feature/vorpal ]
    paths:
      - 'src/**/*.java'
      - 'pom.xml'
      - '.github/workflows/vorpal.yml'
  push:
    branches: [ feature/vorpal ]
    paths:
      - 'src/**/*.java'
      - 'pom.xml'
      - '.github/workflows/vorpal.yml'

jobs:
  vorpal-scan:
    name: Vorpal Security Analysis
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      
      - name: Vorpal Security Scan - Single File
        uses: checkmarx/vorpal-reviewdog-github-action@v1.2.0
        with:
          source_path: 'src/main/java/com/cx/plugin/cli/CxConsoleLauncher.java'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: error
          filter_mode: file
          fail_on_error: false
      
      - name: Comment PR with scan summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Vorpal Security Scan Results')
            );
            
            const body = `## 🔍 Vorpal Security Scan Results
            
            Vorpal has completed its security analysis of your Java code changes.
            
            **What was scanned:**
            - Changed Java files: ${{ steps.changed-files.outputs.all_changed_files || 'None' }}
            - Scan mode: ${{ steps.changed-files.outputs.any_changed == 'true' && 'Changed files only' || 'Full source scan' }}
            
            **Security Focus Areas:**
            - Java security best practices
            - Common vulnerability patterns
            - Code quality and security issues
            
            Please review any security findings above and address them before merging.
            
            ---
            *Powered by [Vorpal](https://checkmarx.com/) - Ultra-fast security scanning for developers*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  vorpal-baseline:
    name: Vorpal Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/vorpal'
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      
      - name: Vorpal Baseline Analysis
        uses: checkmarx/vorpal-reviewdog-github-action@v1.2.0
        with:
          source_path: 'src/main/java'
          folders_to_ignore: 'target,logs,.git,.github,src/test'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: info
          filter_mode: nofilter
          fail_on_error: false
          reviewdog_flags: '-name="Vorpal Baseline"'
